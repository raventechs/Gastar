<title>GastAr — Gastos del hogar</title>

<style>
:root{
  --bg:#f3f7f6; --card:#ffffff; --tx:#10302d; --mut:#5b7471; --brand:#0F766E; --brand2:#134E4A; --line:#dbe7e5;
  --acc:#FBBF24; --ok:#16a34a; --sh:0 1px 3px rgba(16,48,45,.10);
  --red:#dc2626; --redbg:#fee2e2; --org:#ea580c; --orgbg:#ffedd5; --yel:#a16207; --yelbg:#fef9c3; --grn:#15803d; --grnbg:#dcfce7;
}
:root[data-tema="oscuro"]{
  --bg:#0c1b1a; --card:#142826; --tx:#e6f2f0; --mut:#93b0ac; --brand:#2dd4bf; --brand2:#99f6e4; --line:#24413e;
  --sh:none;
  --redbg:#3b1717; --orgbg:#3a2412; --yelbg:#35300f; --grnbg:#10301c;
  --red:#f87171; --org:#fb923c; --yel:#facc15; --grn:#4ade80;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:16px}
body{min-height:100vh;min-height:100dvh}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
.oculto{display:none!important}

/* Pantalla de carga */
#carga{position:fixed;inset:0;background:#0F766E;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:9999;transition:opacity .4s}
#carga.fuera{opacity:0;pointer-events:none}
.moneda{width:84px;height:84px;border-radius:50%;background:#FBBF24;border:8px solid #134E4A;display:flex;align-items:center;justify-content:center;font-size:44px;font-weight:800;color:#134E4A;animation:gira 1.4s ease-in-out infinite}
@keyframes gira{0%{transform:rotateY(0)}50%{transform:rotateY(180deg) translateY(-10px)}100%{transform:rotateY(360deg)}}
#carga h1{color:#fff;margin:22px 0 4px;font-size:28px;letter-spacing:.5px}
#carga p{color:#b7efe6;margin:0}

/* Estructura */
.wrap{max-width:560px;margin:0 auto;padding:0 14px}
header.top{position:sticky;top:0;z-index:20;background:var(--brand);color:#fff;padding:calc(env(safe-area-inset-top) + 10px) 0 10px}
[data-tema="oscuro"] header.top{background:#0f3a36}
header.top .wrap{display:flex;align-items:center;gap:10px}
.logo{width:38px;height:38px;border-radius:10px;flex:none;cursor:pointer;user-select:none}
.ttl{flex:1;min-width:0}
.ttl b{display:block;font-size:19px;line-height:1.1}
.ttl small{display:block;opacity:.85;font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ibtn{background:rgba(255,255,255,.16);border:0;color:#fff;width:38px;height:38px;border-radius:50%;font-size:18px}
main{padding:14px 0 150px}
h2{font-size:15px;margin:18px 2px 8px;color:var(--mut);text-transform:uppercase;letter-spacing:.6px}
.card{background:var(--card);border-radius:16px;padding:14px;box-shadow:var(--sh);border:1px solid var(--line)}
.btn{border:0;border-radius:12px;padding:12px 16px;font-weight:700;background:var(--brand);color:#fff}
[data-tema="oscuro"] .btn{color:#062b27}
.btn.sec{background:transparent;color:var(--brand);border:1.5px solid var(--brand)}
.btn.peli{background:var(--red);color:#fff}
.btn.full{width:100%}
.btn.chico{padding:8px 12px;font-size:14px}
.btn:disabled{opacity:.4}
.fila{display:flex;gap:10px;align-items:center}
.mut{color:var(--mut)}
.grid2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px}

/* Resumen */
.resumen .mes{font-weight:700;font-size:14px;color:var(--mut)}
.resumen .grande{font-size:30px;font-weight:800;margin:2px 0}
.barra{height:10px;border-radius:99px;background:var(--line);overflow:hidden;margin:10px 0 6px}
.barra i{display:block;height:100%;background:var(--ok);width:0;transition:width .5s}
.usd{font-size:14px;color:var(--mut)}

/* Vencimientos */
.venc{display:flex;gap:10px;align-items:center;border-radius:14px;padding:11px 12px;margin-bottom:9px;border-left:7px solid;min-width:0}
.venc.c-red{background:var(--redbg);border-color:var(--red)}
.venc.c-org{background:var(--orgbg);border-color:var(--org)}
.venc.c-yel{background:var(--yelbg);border-color:var(--yel)}
.venc.c-grn{background:var(--grnbg);border-color:var(--grn)}
.venc .ico{font-size:24px;flex:none}
.venc .main{flex:1;min-width:0;cursor:pointer}
.venc .main b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.venc .main small{display:block;font-size:13px;font-weight:600}
.c-red small{color:var(--red)} .c-org small{color:var(--org)} .c-yel small{color:var(--yel)} .c-grn small{color:var(--grn)}
.venc .monto{font-weight:800;text-align:right;white-space:nowrap;font-size:15px}
.venc .btn{padding:9px 12px;font-size:14px}

/* Lista por categoría */
.mesnav{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.mesnav b{font-size:17px}
.cat{margin-bottom:10px;padding:0;overflow:hidden}
.cat-h{display:flex;align-items:center;gap:10px;padding:13px 14px;width:100%;background:none;border:0;text-align:left}
.cat-h .t{flex:1;min-width:0}
.cat-h .t b{display:block}
.cat-h .t small{color:var(--mut);font-size:12.5px}
.cat-h .chev{transition:transform .2s;color:var(--mut)}
.cat.abierta .chev{transform:rotate(180deg)}
.cat-b{display:none;border-top:1px solid var(--line)}
.cat.abierta .cat-b{display:block}
.row{display:flex;align-items:center;gap:10px;padding:10px 14px;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}
.chk{width:30px;height:30px;border-radius:50%;border:2.5px solid var(--mut);background:none;flex:none;color:#fff;font-weight:900;line-height:1;padding:0}
.chk.ok{background:var(--ok);border-color:var(--ok)}
.chk.venc-x{border-color:var(--red)}
.row .main{flex:1;min-width:0;cursor:pointer}
.row .main b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .main small{color:var(--mut);font-size:12.5px}
.row .main small .v{color:var(--red);font-weight:700}
.row.pagado .main b{text-decoration:line-through;color:var(--mut)}
.row .monto{font-weight:700;white-space:nowrap;font-size:14.5px}
.vacio{text-align:center;color:var(--mut);padding:26px 10px}

/* Barra inferior */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
nav.tabs .wrap{display:grid;grid-template-columns:repeat(3,minmax(0,1fr))}
nav.tabs button{background:none;border:0;padding:9px 0 7px;color:var(--mut);font-size:12px;font-weight:600;display:flex;flex-direction:column;align-items:center;gap:2px}
nav.tabs button span{font-size:22px;line-height:1}
nav.tabs button.on{color:var(--brand)}
.fab{position:fixed;right:max(16px,calc(50% - 264px));bottom:calc(76px + env(safe-area-inset-bottom));z-index:31;width:58px;height:58px;border-radius:50%;border:0;background:var(--acc);color:#134E4A;font-size:34px;font-weight:700;box-shadow:0 4px 14px rgba(0,0,0,.3);line-height:1}

/* Banners */
.banner{border-radius:12px;padding:11px 13px;margin-bottom:10px;font-size:14px;display:flex;gap:10px;align-items:center}
.banner.demo{background:var(--grnbg);color:var(--tx);border:1px solid var(--grn)}
.banner.demo.urgente{background:var(--redbg);border-color:var(--red);animation:titila 1s infinite}
@keyframes titila{50%{opacity:.55}}
.banner.info{background:var(--card);border:1px solid var(--line)}
.banner .btn{margin-left:auto;flex:none}

/* Formularios y hojas */
.velo{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:60;display:flex;align-items:flex-end;justify-content:center}
.hoja{background:var(--card);width:100%;max-width:560px;max-height:92vh;overflow:auto;border-radius:20px 20px 0 0;padding:16px 16px calc(20px + env(safe-area-inset-bottom))}
.hoja h3{margin:0 0 12px;font-size:19px}
label.f{display:block;font-size:13px;font-weight:600;color:var(--mut);margin:10px 0 4px}
.in{width:100%;border:1.5px solid var(--line);background:var(--bg);border-radius:11px;padding:11px 12px;min-width:0}
.in:focus{outline:2px solid var(--brand);border-color:var(--brand)}
.seg{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.seg button{border:1.5px solid var(--line);background:var(--bg);border-radius:11px;padding:10px;font-weight:600}
.seg button.on{border-color:var(--brand);background:var(--brand);color:#fff}
[data-tema="oscuro"] .seg button.on{color:#062b27}
.err{background:var(--redbg);color:var(--red);border-radius:10px;padding:9px 11px;font-size:13.5px;margin-top:10px;word-break:break-word}
.acc{display:flex;gap:10px;margin-top:16px}
.acc .btn{flex:1}

/* Pantallas completas (login, hogar, bloqueo) */
.pant{min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;text-align:center;background:linear-gradient(160deg,#0F766E,#134E4A);color:#fff}
.pant .moneda{animation:none;margin-bottom:6px}
.pant h1{margin:14px 0 4px;font-size:34px}
.pant p{margin:6px 0 16px;color:#c9f1ea;max-width:340px}
.pant .card{color:var(--tx);width:100%;max-width:380px;text-align:left}
.pant>.btn{background:var(--acc);color:#134E4A}
.pant .card .btn{background:var(--brand);color:#fff}
.pant .card .btn.sec{background:transparent;color:var(--brand)}
.codigo{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:26px;letter-spacing:4px;font-weight:800;text-align:center;padding:10px;background:var(--bg);border-radius:12px;border:2px dashed var(--brand)}

.toast{position:fixed;left:50%;bottom:calc(150px + env(safe-area-inset-bottom));transform:translateX(-50%);background:#10302d;color:#fff;padding:11px 16px;border-radius:12px;z-index:90;max-width:90%;font-size:14px;box-shadow:0 4px 14px rgba(0,0,0,.35)}
.kv{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--line);font-size:14.5px}
.kv:last-child{border-bottom:0}
.kv>span:last-child,.kv>b:last-child{text-align:right;word-break:break-word;min-width:0}
.mini{font-size:12.5px;color:var(--mut)}
.tour-demo .venc{margin-bottom:6px}
.pie{text-align:center;color:var(--mut);font-size:12px;margin:22px 0 0}
</style>
</head>

<!-- SDK Firebase (compat) -->
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>

<script>
/* ═══════════════ CONFIG (se completa una sola vez) ═══════════════ */
const VERSION = '1.0.0';
const FIREBASE_CONFIG = {
  apiKey: 'AIzaSyBlftKE_pqK6afzv1pe8PS58sYlb2Z93Uk',
  authDomain: 'charlar-e5408.firebaseapp.com',
  projectId: 'charlar-e5408',
  storageBucket: 'charlar-e5408.firebasestorage.app',
  messagingSenderId: '471550179133',
  appId: '1:471550179133:web:3c06e945f81eb9fd477754'
};
const VAPID_KEY = 'PEGAR_CLAVE_VAPID_PUBLICA';      // Firebase > Cloud Messaging > Certificados push web
const WA_VENTAS = '5490000000000';                   // WhatsApp de RavenTechs para activar cuentas (sin + ni espacios)
const DIAS_DEMO = 14;
const LIMITE_INTEGRANTES = 2;
/* ═════════════════════════════════════════════════════════════════ */

/* ───────── Utilidades ───────── */
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad = n => String(n).padStart(2, '0');
const CATS = [
  {id:'impuestos', n:'Impuestos', e:'🏛️'}, {id:'servicios', n:'Servicios', e:'💡'}, {id:'hogar', n:'Hogar y alquiler', e:'🏠'},
  {id:'alimentos', n:'Alimentos', e:'🛒'}, {id:'salud', n:'Salud', e:'🩺'}, {id:'educacion', n:'Educación', e:'🎓'},
  {id:'familia', n:'Familia', e:'👨‍👩‍👧'}, {id:'seguros', n:'Seguros', e:'🛡️'}, {id:'suscripciones', n:'Suscripciones', e:'📱'},
  {id:'transporte', n:'Transporte', e:'🚗'}, {id:'deudas', n:'Deudas y tarjetas', e:'💳'}, {id:'otros', n:'Otros', e:'📦'}
];
const catDe = id => CATS.find(c => c.id === id) || CATS[CATS.length - 1];

/* ───────── Núcleo de fechas y vencimientos (puro, testeable) ───────── */
const Core = {
  hoy(){ const d = new Date(); return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); },
  ymNow(){ return Core.hoy().slice(0, 7); },
  addMonths(ym, n){ let [y, m] = ym.split('-').map(Number); m = m - 1 + n; y += Math.floor(m / 12); m = ((m % 12) + 12) % 12; return y + '-' + pad(m + 1); },
  dim(y, m){ return new Date(y, m, 0).getDate(); },
  diffDays(a, b){ const [y1, m1, d1] = a.split('-').map(Number), [y2, m2, d2] = b.split('-').map(Number); return Math.round((Date.UTC(y1, m1 - 1, d1) - Date.UTC(y2, m2 - 1, d2)) / 86400000); },
  fechaDe(g, ym){
    if (g.tipo === 'unico') return (g.fecha && g.fecha.slice(0, 7) === ym) ? g.fecha : null;
    if (g.desdeMes && ym < g.desdeMes) return null;
    if (g.hastaMes && ym > g.hastaMes) return null;
    const [y, m] = ym.split('-').map(Number);
    return ym + '-' + pad(Math.min(Number(g.dia) || 1, Core.dim(y, m)));
  },
  clave(g, ym){ return g.tipo === 'unico' ? g.id + '_u' : g.id + '_' + ym; },
  /* Ocurrencias de gastos para una lista de meses. */
  ocurrencias(gastos, pagos, meses){
    const out = [];
    for (const g of gastos) {
      if (g.tipo === 'unico') {
        if (!g.fecha) continue;
        const ym = g.fecha.slice(0, 7);
        if (meses.includes(ym)) out.push({g, ym, fecha: g.fecha, key: Core.clave(g, ym), pago: pagos.get(Core.clave(g, ym)) || null});
      } else {
        for (const ym of meses) {
          const f = Core.fechaDe(g, ym);
          if (f) out.push({g, ym, fecha: f, key: Core.clave(g, ym), pago: pagos.get(Core.clave(g, ym)) || null});
        }
      }
    }
    return out.sort((a, b) => a.fecha < b.fecha ? -1 : a.fecha > b.fecha ? 1 : a.g.nombre.localeCompare(b.g.nombre));
  },
  /* Pendientes para el inicio: sin pago, ordenados por fecha; incluye únicos vencidos de cualquier mes. */
  pendientes(gastos, pagos, hoy){
    const cur = hoy.slice(0, 7);
    const meses = [-2, -1, 0, 1, 2, 3].map(n => Core.addMonths(cur, n));
    const out = Core.ocurrencias(gastos, pagos, meses).filter(o => !o.pago);
    for (const g of gastos) {
      if (g.tipo === 'unico' && g.fecha && g.fecha.slice(0, 7) < meses[0] && !pagos.get(Core.clave(g, g.fecha.slice(0, 7)))) {
        out.push({g, ym: g.fecha.slice(0, 7), fecha: g.fecha, key: Core.clave(g, g.fecha.slice(0, 7)), pago: null});
      }
    }
    return out.sort((a, b) => a.fecha < b.fecha ? -1 : a.fecha > b.fecha ? 1 : 0);
  },
  /* Color por posición en la lista de 8: 2 rojo, 2 naranja, 2 amarillo, 2 verde. */
  colorPos(i){ return ['c-red', 'c-red', 'c-org', 'c-org', 'c-yel', 'c-yel', 'c-grn', 'c-grn'][i] || 'c-grn'; },
  cuando(diff){
    if (diff < -1) return 'Vencido hace ' + (-diff) + ' días';
    if (diff === -1) return 'Venció ayer';
    if (diff === 0) return 'Vence hoy';
    if (diff === 1) return 'Vence mañana';
    return 'Vence en ' + diff + ' días';
  },
  parseMonto(s){
    s = String(s == null ? '' : s).trim().replace(/[\s$]|US/gi, '');
    if (!s) return NaN;
    if (s.includes(',')) s = s.replace(/\./g, '').replace(',', '.');
    else if (/^\d{1,3}(\.\d{3})+$/.test(s)) s = s.replace(/\./g, '');
    const n = Number(s);
    return isFinite(n) ? n : NaN;
  },
  totales(ocs){
    const t = {ARS: {pend: 0, pag: 0}, USD: {pend: 0, pag: 0}};
    for (const o of ocs) {
      const m = (o.g.moneda === 'USD') ? 'USD' : 'ARS';
      if (o.pago) t[m].pag += Number(o.pago.monto) || 0; else t[m].pend += Number(o.g.monto) || 0;
    }
    return t;
  }
};
const money = (n, cur) => (cur === 'USD' ? 'US$ ' : '$ ') + new Intl.NumberFormat('es-AR', {maximumFractionDigits: 2}).format(Number(n) || 0);
const fechaCorta = f => { const [y, m, d] = f.split('-'); return d + '/' + m; };
const nombreMes = ym => { const [y, m] = ym.split('-').map(Number); const t = new Date(y, m - 1, 1).toLocaleDateString('es-AR', {month: 'long', year: 'numeric'}); return t.charAt(0).toUpperCase() + t.slice(1); };

/* ───────── Firebase ───────── */
firebase.initializeApp(FIREBASE_CONFIG);
const auth = firebase.auth();
const db = firebase.firestore();
const FV = firebase.firestore.FieldValue;
const TS = firebase.firestore.Timestamp;
try { db.enablePersistence({synchronizeTabs: true}).catch(() => {}); } catch (e) {}

/* ───────── Estado ───────── */
const S = {
  user: null, admin: false, userDoc: null, hid: null, hogar: null, gastos: [], pagos: new Map(),
  tab: 'inicio', mes: Core.ymNow(), abiertas: new Set(), abiertasInit: null,
  unsubs: [], cargado: {gastos: false, pagos: false}, instalar: null, errCount: 0
};
const esAdmin = () => !!(S.user && S.admin);
const root = document.getElementById('root');
const $ = (s, el) => (el || document).querySelector(s);

/* ───────── Registro de errores (colección errores, solo crear) ───────── */
function logError(msg, stack){
  try {
    if (S.errCount++ > 4 || !S.user) return;
    db.collection('errores').add({app: 'gastar', v: VERSION, msg: String(msg).slice(0, 300), stack: String(stack || '').slice(0, 600), uid: S.user.uid, ua: navigator.userAgent.slice(0, 160), ts: FV.serverTimestamp()}).catch(() => {});
  } catch (e) {}
}
window.addEventListener('error', e => logError(e.message, e.error && e.error.stack));
window.addEventListener('unhandledrejection', e => logError('promesa: ' + (e.reason && e.reason.message || e.reason), e.reason && e.reason.stack));

/* ───────── UI básica ───────── */
function toast(msg, ms){
  const t = document.createElement('div'); t.className = 'toast'; t.textContent = msg; document.body.appendChild(t);
  setTimeout(() => t.remove(), ms || 2600);
}
function hoja(html, opts){
  const v = document.createElement('div'); v.className = 'velo';
  v.innerHTML = '<div class="hoja" role="dialog">' + html + '</div>';
  v.addEventListener('mousedown', e => { if (e.target === v && !(opts && opts.fija)) v.remove(); });
  document.body.appendChild(v);
  return v;
}
function preguntar(texto, ok, peligro){
  return new Promise(res => {
    const v = hoja('<h3>' + esc(texto) + '</h3><div class="acc"><button class="btn sec" data-r="0">Cancelar</button><button class="btn ' + (peligro ? 'peli' : '') + '" data-r="1">' + esc(ok || 'Aceptar') + '</button></div>');

}
function temaInicial(){
  let t = null; try { t = localStorage.getItem('gastar-tema'); } catch (e) {}
  if (!t) t = (window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches) ? 'oscuro' : 'claro';
  document.documentElement.setAttribute('data-tema', t);
}
function cambiarTema(){
  const t = document.documentElement.getAttribute('data-tema') === 'oscuro' ? 'claro' : 'oscuro';
  document.documentElement.setAttribute('data-tema', t);
  try { localStorage.setItem('gastar-tema', t); } catch (e) {}
}

async function ingresarGoogle(){
  const b = $('#btnGoogle'); if (b) b.disabled = true;
  try {
    await auth.signInWithPopup(new firebase.auth.GoogleAuthProvider());
  } catch (e) {
    if (b) b.disabled = false;

auth.onAuthStateChanged(async u => {
  cortarListeners();
  S.user = u; S.admin = false; S.userDoc = null; S.hid = null; S.hogar = null; S.gastos = []; S.pagos = new Map(); backupHecho = false;
  S.tab = 'inicio'; S.mes = Core.ymNow(); S.abiertasInit = null; S.abiertas = new Set();
  if (!u) { finCarga(); return render(); }
  try {
    try { const a = await db.collection('admins').doc(u.uid).get(); S.admin = !!a.exists; } catch (e) { S.admin = false; }
    const ref = db.collection('usuarios').doc(u.uid);
    const snap = await ref.get();
    S.userDoc = snap.exists ? snap.data() : null;
    await ref.set({email: u.email || '', nombre: u.displayName || '', ult: FV.serverTimestamp()}, {merge: true});
    if (S.userDoc && S.userDoc.hogarId) await escucharHogar(S.userDoc.hogarId);
  } catch (e) { console.error(e); logError(e.message, e.stack); }
  finCarga(); render();
});
function finCarga(){ const c = document.getElementById('carga'); if (c) { c.classList.add('fuera'); setTimeout(() => c.remove(), 500); } }
function cortarListeners(){ S.unsubs.forEach(f => { try { f(); } catch (e) {} }); S.unsubs = []; S.cargado = {gastos: false, pagos: false}; }

async function escucharHogar(hid){
  S.hid = hid;
  const href = db.collection('hogares').doc(hid);
  await new Promise(resolve => {
    let primera = true;
    S.unsubs.push(href.onSnapshot(s => {
      if (!s.exists) { S.hogar = null; } else { S.hogar = Object.assign({id: s.id}, s.data()); }
      if (primera) { primera = false; resolve(); } else render();
    }, err => {
      console.error(err); S.hogar = null; S.hid = null;
      db.collection('usuarios').doc(S.user.uid).set({hogarId: null}, {merge: true}).catch(() => {});
      if (primera) { primera = false; resolve(); } else render();
    }));
  });
  if (!S.hogar) return;
  S.unsubs.push(href.collection('gastos').onSnapshot(q => {
    S.gastos = q.docs.map(d => Object.assign({id: d.id}, d.data())); S.cargado.gastos = true; alCargar(); render();
  }, e => { console.error(e); logError('gastos: ' + e.message); }));
  S.unsubs.push(href.collection('pagos').onSnapshot(q => {
    const m = new Map(); q.docs.forEach(d => m.set(d.id, Object.assign({id: d.id}, d.data()))); S.pagos = m; S.cargado.pagos = true; alCargar(); render();
  }, e => { console.error(e); logError('pagos: ' + e.message); }));
}
let backupHecho = false;
function alCargar(){ if (S.cargado.gastos && S.cargado.pagos && !backupHecho) { backupHecho = true; backupDiario(); } }

/* ───────── Hogar: crear / unirse ───────── */
function generarCodigo(){
  const al = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789'; const a = new Uint32Array(8); crypto.getRandomValues(a);
  return Array.from(a).map(n => al[n % al.length]).join('');
}
async function crearHogar(){
  const nombre = ($('#hogarNombre').value || '').trim() || 'Mi hogar';
  const u = S.user, cod = generarCodigo(), hid = db.collection('hogares').doc().id;
  let paso = 'hogar';
  try {
    await db.collection('hogares').doc(hid).set({
      nombre: nombre.slice(0, 60), ownerUid: u.uid, ownerEmail: u.email || '', miembros: [u.uid],
      integrantes: {[u.uid]: {nombre: u.displayName || '', email: u.email || ''}},
      codigoActual: cod, limiteIntegrantes: LIMITE_INTEGRANTES,
      demoHasta: TS.fromMillis(Date.now() + DIAS_DEMO * 86400000), creado: FV.serverTimestamp(), version: 1
    });
    paso = 'invitación';
    await db.collection('invitaciones').doc(cod).set({hogarId: hid, ownerUid: u.uid, creado: FV.serverTimestamp()});
    paso = 'usuario';
    await db.collection('usuarios').doc(u.uid).set({hogarId: hid}, {merge: true});
  } catch (e) { return errPant('No se pudo crear el hogar, paso ' + paso + ' (' + (e.code || e.message) + ')'); }
  S.userDoc = {hogarId: hid}; cortarListeners(); backupHecho = false; await escucharHogar(hid); render();
}
async function unirseHogar(){
  const cod = ($('#hogarCodigo').value || '').trim().toUpperCase().replace(/[^A-Z0-9]/g, '');
  if (cod.length < 6) return errPant('Escribí el código completo que te pasaron.');
  const u = S.user;
  try {
    const inv = await db.collection('invitaciones').doc(cod).get();
    if (!inv.exists) return errPant('Ese código no existe o ya fue reemplazado. Pedí uno nuevo.');
    const hid = inv.data().hogarId;
    await db.collection('hogares').doc(hid).update({
      miembros: FV.arrayUnion(u.uid), ['integrantes.' + u.uid]: {nombre: u.displayName || '', email: u.email || ''}, joinCode: cod
    });
    await db.collection('usuarios').doc(u.uid).set({hogarId: hid}, {merge: true});
    S.userDoc = {hogarId: hid}; cortarListeners(); backupHecho = false; await escucharHogar(hid); render();
  } catch (e) {
    errPant(e.code === 'permission-denied' ? 'No se pudo unir: el hogar ya tiene el máximo de integrantes de su plan o el código no es válido.' : 'No se pudo unir (' + (e.code || e.message) + ')');
  }
}
function errPant(m){ const e = $('#errHogar'); if (e) { e.textContent = m; e.classList.remove('oculto'); } }

/* ───────── Estado de la prueba ───────── */
function demoInfo(){
  const h = S.hogar; if (!h || esAdmin()) return {estado: 'cliente'};
  if (h.demoHasta === null || h.demoHasta === undefined) return {estado: 'cliente'};
  const ms = h.demoHasta.toMillis ? h.demoHasta.toMillis() : Number(h.demoHasta);
  const dias = Math.ceil((ms - Date.now()) / 86400000);
  return dias > 0 ? {estado: 'demo', dias} : {estado: 'vencida', dias: 0};
}

function vInicio(){
  const hoy = Core.hoy(), cur = Core.ymNow();
  const delMes = Core.ocurrencias(S.gastos, S.pagos, [cur]);
  const t = Core.totales(delMes);
  const tot = t.ARS.pend + t.ARS.pag, pct = tot > 0 ? Math.round(t.ARS.pag * 100 / tot) : 0;
  let h = '<div class="card resumen"><div class="mes">' + esc(nombreMes(cur)) + '</div>' +
    '<div class="grande">' + money(t.ARS.pend, 'ARS') + '</div><div class="mut">falta pagar este mes</div>' +
    '<div class="barra"><i style="width:' + pct + '%"></i></div>' +
    '<div class="mini">Pagado ' + money(t.ARS.pag, 'ARS') + ' de ' + money(tot, 'ARS') + ' · ' + pct + '%</div>' +
    ((t.USD.pend + t.USD.pag) > 0 ? '<div class="usd">En dólares: falta ' + money(t.USD.pend, 'USD') + ' · pagado ' + money(t.USD.pag, 'USD') + '</div>' : '') + '</div>';
  h += avisoPush();

  if (!S.cargado.gastos) return h + '<div class="vacio">Cargando…</div>';
  const pend = Core.pendientes(S.gastos, S.pagos, hoy).slice(0, 8);
  if (!S.gastos.length) {
    h += '<div class="card vacio">Todavía no cargaste gastos.<br>Tocá el <b>+</b> para agregar el primero: alquiler, luz, tarjeta…<br><br><button class="btn sec" data-a="tour">Ver cómo funciona</button></div>';
  } else if (!pend.length) {
    h += '<div class="card vacio">🎉 No tenés vencimientos pendientes.</div>';
  } else {
    h += pend.map((o, i) => cardVenc(o, i, hoy)).join('');
    h += '<div class="mini" style="text-align:center">Rojo: lo más urgente · verde: lo que viene más adelante</div>';
  }
  return h;
}
function cardVenc(o, i, hoy){
  const diff = Core.diffDays(o.fecha, hoy), c = catDe(o.g.categoria);
  return '<div class="venc ' + Core.colorPos(i) + '"><div class="ico">' + c.e + '</div>' +
    '<div class="main" data-a="editar" data-g="' + esc(o.g.id) + '"><b>' + esc(o.g.nombre) + '</b><small>' + Core.cuando(diff) + ' · ' + fechaCorta(o.fecha) + '</small></div>' +

function avisoPush(){
  if (!('Notification' in window) || Notification.permission === 'granted' || Notification.permission === 'denied') return '';
  if (esIOS && !instalada()) return '';
  return '<div class="banner info" style="margin-top:10px">🔔 <span>Activá los avisos para enterarte de los vencimientos.</span><button class="btn chico" data-a="avisos">Activar</button></div>';

/* ───────── Vista Gastos (secciones desplegables por categoría) ───────── */
function vGastos(){

  const ocs = Core.ocurrencias(S.gastos, S.pagos, [S.mes]);

  let h = '<div class="mesnav"><button class="btn sec chico" data-a="mes" data-n="-1" ' + (S.mes <= min ? 'disabled' : '') + '>‹</button><b>' + esc(nombreMes(S.mes)) + '</b><button class="btn sec chico" data-a="mes" data-n="1" ' + (S.mes >= max ? 'disabled' : '') + '>›</button></div>';
  h += '<div class="card" style="margin-bottom:12px"><div class="kv"><span>Falta pagar</span><b>' + money(t.ARS.pend, 'ARS') + (t.USD.pend ? ' + ' + money(t.USD.pend, 'USD') : '') + '</b></div>' +
       '<div class="kv"><span>Ya pagado</span><b>' + money(t.ARS.pag, 'ARS') + (t.USD.pag ? ' + ' + money(t.USD.pag, 'USD') : '') + '</b></div></div>';

  if (!ocs.length) return h + '<div class="card vacio">No hay gastos este mes.<br>Tocá <b>+</b> para agregar.</div>';

      '<span class="t"><b>' + esc(c.n) + '</b><small>' + (pend ? pend + ' pendiente' + (pend > 1 ? 's' : '') : 'todo pagado ✓') + ' · ' + money(tt.ARS.pend + tt.ARS.pag, 'ARS') + (tt.USD.pend + tt.USD.pag ? ' + ' + money(tt.USD.pend + tt.USD.pag, 'USD') : '') + (saldo ? ' · saldo ' + money(saldo, 'ARS') : '') + '</small></span><span class="chev">▾</span></button>' +
      '<div class="cat-b">' + l.map(o => filaGasto(o, hoy)).join('') + '</div></div>';

    : '<span class="' + (venc ? 'v' : '') + '">' + Core.cuando(diff) + ' · ' + fechaCorta(o.fecha) + '</span>';
  return '<div class="row ' + (o.pago ? 'pagado' : '') + '"><button class="chk ' + (o.pago ? 'ok' : venc ? 'venc-x' : '') + '" data-a="' + (o.pago ? 'despagar' : 'pagar') + '" data-k="' + esc(o.key) + '" data-g="' + esc(g.id) + '" data-m="' + o.ym + '" aria-label="' + (o.pago ? 'Deshacer pago' : 'Marcar pagado') + '">' + (o.pago ? '✓' : '') + '</button>' +

async function guardarGasto(v, g){
  const err = m => { const e = $('#gErr', v); e.textContent = m; e.classList.remove('oculto'); };
  const nombre = $('#gNombre', v).value.trim(), monto = Core.parseMonto($('#gMonto', v).value), cat = $('#gCat', v).value;
  if (!nombre) return err('Poné un nombre.');
  if (isNaN(monto) || monto < 0) return err('Escribí el monto con números. Ej: 85000');
  const doc = {nombre, categoria: cat, monto, moneda: formG.moneda, tipo: formG.tipo, nota: $('#gNota', v).value.trim()};
  const borrar = [];
  if (formG.tipo === 'fijo') {
    const dia = parseInt($('#gDia', v).value, 10);
    if (!(dia >= 1 && dia <= 31)) return err('El día tiene que ser de 1 a 31.');
    doc.dia = dia; borrar.push('fecha');
  } else {
    const f = $('#gFecha', v).value; if (!f) return err('Elegí la fecha.');
    doc.fecha = f; borrar.push('dia');
  }
  if (cat === 'deudas') { const s = Core.parseMonto($('#gSaldo', v).value); if (isNaN(s)) borrar.push('saldo'); else doc.saldo = s; } else borrar.push('saldo');
  try {
    const col = db.collection('hogares').doc(S.hid).collection('gastos');
    if (g) { const upd = Object.assign({}, doc); borrar.forEach(k => upd[k] = FV.delete()); await col.doc(g.id).update(upd); }
    else {
      const cur = Core.ymNow();
      const nuevo = Object.assign({}, doc, {creadoPor: S.user.uid, creado: FV.serverTimestamp()});
      if (formG.tipo === 'fijo') nuevo.desdeMes = ($('#gDesde', v).value === 'prox') ? Core.addMonths(cur, 1) : cur;
      await col.add(nuevo);
    }
    v.remove(); toast(g ? 'Gasto actualizado' : 'Gasto agregado');
  } catch (e) { err(e.code === 'permission-denied' ? 'No se pudo guardar: la prueba terminó o no tenés permiso.' : 'No se pudo guardar (' + (e.code || e.message) + ')'); logError(e.message, e.stack); }
}
async function eliminarGasto(id){
  try {
    const ref = db.collection('hogares').doc(S.hid);

    const b = db.batch(); ps.docs.forEach(d => b.delete(d.ref)); b.delete(ref.collection('gastos').doc(id)); await b.commit();

}

/* ───────── Backup ───────── */
const jsonReplacer = (k, v) => (v && typeof v === 'object' && typeof v.toMillis === 'function') ? {_ts: v.toMillis()} : v;
const jsonReviver = (k, v) => (v && typeof v === 'object' && v._ts !== undefined && Object.keys(v).length === 1) ? TS.fromMillis(v._ts) : v;
function datosBackup(){ return {app: 'gastar', version: VERSION, hogar: S.hid, nombre: S.hogar && S.hogar.nombre, fecha: new Date().toISOString(), gastos: S.gastos, pagos: Array.from(S.pagos.values())}; }
function backupDiario(){
  try {
    const key = 'gastar-bk-' + S.hid, hoy = Core.hoy();
    const o = JSON.parse(localStorage.getItem(key) || '{}');
    if (o[hoy]) return;
    o[hoy] = JSON.stringify(datosBackup(), jsonReplacer);
    Object.keys(o).sort().slice(0, -7).forEach(k => delete o[k]);
    localStorage.setItem(key, JSON.stringify(o));
  } catch (e) {}
}
function bajarBackup(){
  const blob = new Blob([JSON.stringify(datosBackup(), jsonReplacer, 2)], {type: 'application/json'});
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'gastar-backup-' + Core.hoy() + '.json';
  document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 500);
}
async function restaurarBackup(file){
  try {
    const o = JSON.parse(await file.text(), jsonReviver);
    if (o.app !== 'gastar' || !Array.isArray(o.gastos)) return toast('Ese archivo no es una copia de GastAr');
    if (!(await preguntar('Se van a cargar ' + o.gastos.length + ' gastos y ' + (o.pagos || []).length + ' pagos. No se borra nada de lo que ya tenés. ¿Seguir?', 'Restaurar'))) return;
    const ref = db.collection('hogares').doc(S.hid);
    const items = o.gastos.map(g => ['gastos', g]).concat((o.pagos || []).map(p => ['pagos', p]));
    for (let i = 0; i < items.length; i += 400) {
      const b = db.batch();
      items.slice(i, i + 400).forEach(([col, d]) => { const id = d.id, resto = Object.assign({}, d); delete resto.id; b.set(ref.collection(col).doc(id), resto, {merge: true}); });
      await b.commit();
    }
    toast('Copia restaurada ✓');
  } catch (e) { toast('No se pudo restaurar (' + (e.code || e.message) + ')'); }
}

    try {
      const cod = generarCodigo(), ref = db.collection('hogares').doc(S.hid), viejo = S.hogar.codigoActual, bt = db.batch();
      bt.set(db.collection('invitaciones').doc(cod), {hogarId: S.hid, ownerUid: S.user.uid, creado: FV.serverTimestamp()});
      bt.update(ref, {codigoActual: cod}); if (viejo) bt.delete(db.collection('invitaciones').doc(viejo));
      await bt.commit(); toast('Código nuevo listo');
    } catch (er) { toast('No se pudo (' + (er.code || er.message) + ')'); }
  }
  else if (a === 'quitar') {
    if (!(await preguntar('¿Quitar a esta persona del hogar?', 'Quitar', true))) return;
    try { const u = b.dataset.u; await db.collection('hogares').doc(S.hid).update({miembros: FV.arrayRemove(u), ['integrantes.' + u]: FV.delete()}); toast('Integrante quitado'); } catch (er) { toast('No se pudo (' + (er.code || er.message) + ')'); }
  }
  else if (a === 'irse') {
    if (!(await preguntar('¿Salir de este hogar? Dejás de ver sus gastos.', 'Salir', true))) return;
    try { const u = S.user.uid; await db.collection('hogares').doc(S.hid).update({miembros: FV.arrayRemove(u), ['integrantes.' + u]: FV.delete()}); await db.collection('usuarios').doc(u).set({hogarId: null}, {merge: true}); location.reload(); } catch (er) { toast('No se pudo (' + (er.code || er.message) + ')'); }
  }
});

window.__gastar = {Core, S, money, CATS};
</script>
